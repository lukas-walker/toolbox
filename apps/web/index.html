<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Toolbox</title>
    <meta name="description" content="Local browser tools: PDF, QR codes, and more. No uploads." />

    <!-- PWA / standalone display -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <meta name="theme-color" content="#111419" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Toolbox" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
</head>
<body>
<div class="app-shell">

    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <div class="brand-mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4M3 17l9 4 9-4"/></svg>
            </div>
            <div class="brand-name">Toolbox</div>
        </div>

        <div class="nav-search">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
            <input id="tool-search" type="text" placeholder="Search tools…" autocomplete="off" aria-label="Search tools" />
        </div>

        <nav id="tool-nav" class="tool-nav">
            <!-- nav items injected by JS -->
        </nav>

        <div class="nav-foot">Runs entirely in your browser.<br />No uploads, no tracking.</div>
    </aside>

    <div class="nav-scrim" id="nav-scrim"></div>

    <div class="app-body">
        <header id="app-header" class="topbar">
            <button class="nav-toggle" id="nav-toggle" type="button" aria-label="Toggle navigation">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
            </button>
            <div id="crumb" class="crumb"><!-- breadcrumb injected by JS --></div>
        </header>

        <main id="app-main">
            <!-- active tool / home mounted here -->
        </main>
    </div>
</div>

<noscript>
    This application requires JavaScript to run.
</noscript>

<script type="module" src="/src/main.js"></script>
</body>
</html>
