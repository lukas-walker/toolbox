server {
  listen 3000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Basic security headers (safe for static apps)
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options DENY;
  add_header Referrer-Policy no-referrer;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()";

  # Hashed build assets are content-addressed -> cache aggressively.
  # (Using `expires` instead of add_header keeps the security headers above
  #  inherited; an add_header inside a location would cancel them.)
  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  # The service worker, manifest and app shell must always be revalidated so
  # updates (registerType: autoUpdate) are picked up promptly instead of being
  # stuck behind the browser's HTTP cache. `expires -1` => Cache-Control: no-cache.
  location = /sw.js { expires -1; }
  location = /registerSW.js { expires -1; }
  location = /manifest.webmanifest { expires -1; }
  location = /index.html { expires -1; }

  # SPA-style fallback for everything else.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
